<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>syuPげーむ</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="background.css"></head><body>
<section id="title-screen" class="screen title-screen"><h1>syuPげーむ</h1><img class="title-character" src="title-assets/title-character.png" alt="タイトルキャラクター"><p>syuPworks 2026</p><nav class="title-menu" aria-label="タイトルメニュー"><button id="title-start-button" data-action="title-start">START</button><button id="bonus-track-button" data-action="bonus-track" hidden>BONUS TRACK</button></nav></section>
<section id="select-screen" class="screen select-screen" hidden><p class="eyebrow">SELECT MUSIC</p><div id="song-cards" class="song-cards"></div><h1 id="select-title"></h1><p id="select-artist"></p><p id="select-description"></p><p id="select-help">← → 選択　ENTER 決定</p><button id="select-title-button" type="button" data-action="select-title">ESC タイトルへ</button></section>
<section id="difficulty-screen" class="screen difficulty-screen" hidden><p class="eyebrow">SELECT DIFFICULTY</p><h1 id="difficulty-song"></h1><div id="difficulty-list" class="difficulty-list"></div><p>← → / ↑ ↓ 選択　ENTER 決定　ESC 戻る</p></section>
<section id="bonus-screen" class="screen bonus-screen" hidden><p class="eyebrow">BONUS TRACK</p><div class="bonus-song-nav"><button data-action="bonus-prev" aria-label="前の曲">←</button><h1 id="bonus-song-title"></h1><button data-action="bonus-next" aria-label="次の曲">→</button></div><img id="bonus-jacket" class="bonus-jacket" alt="楽曲ジャケット" hidden><div id="bonus-secret-jacket" class="bonus-secret-jacket" hidden aria-label="未発見の楽曲"><b>?</b><small>SECRET TRACK</small></div><div id="bonus-song-meta" class="bonus-song-meta"><p>ARTIST <b id="bonus-artist"></b>　GENRE <b id="bonus-genre"></b></p><p id="bonus-description"></p></div><div id="bonus-records" class="bonus-records"></div><p class="bonus-help">← → 曲切替</p><button id="bonus-title-button" type="button" data-action="bonus-title">ESC タイトルへ</button></section>
<main id="play-screen" class="app showcase" hidden><aside class="work-panel"><div id="background-layer" class="media-frame"><img id="background-image" alt="作品アートワーク" hidden><video id="background-video" muted loop playsinline hidden></video><div id="media-fallback" class="media-fallback"><span>♪</span><small>NO MEDIA</small></div><div class="media-overlay"></div></div><div class="work-copy"><p class="eyebrow">FEATURED WORK</p><h1 id="work-title"></h1><p id="work-description" class="description"></p><dl class="metadata"><div><dt>ARTIST</dt><dd id="work-artist"></dd></div><div><dt>GENRE</dt><dd id="work-genre"></dd></div><div><dt>TEMPO</dt><dd id="work-bpm"></dd></div><div><dt>FORMAT</dt><dd>4 KEYS</dd></div></dl></div></aside><section class="game-panel"><header class="game-header"><div><p class="eyebrow">RHYTHM PLAY</p><h2 id="difficulty">EASY</h2></div><div id="status" hidden></div></header><section class="hud"><span>SCORE <b id="score">0000000</b></span><span class="hp-widget" id="hp-widget">HP <b id="hp-value">100</b><span class="hp-track"><i id="hp-fill"></i></span><span id="hp-recover" class="hp-recover" hidden></span></span><span>COMBO <b id="combo">0</b></span></section><section id="game" class="game"><div id="judgement" class="judgement"></div><div id="countdown" class="countdown" hidden aria-live="polite"></div><div class="lanes" id="lanes"><i></i><i></i><i></i><i></i></div><div class="judge-line"></div><div class="keys"><span>A</span><span>S</span><span>D</span><span>F</span></div></section></section><button id="mobile-pause-button" type="button" data-action="mobile-pause" aria-label="一時停止"><span aria-hidden="true">Ⅱ</span></button></main>
<section id="result-screen" class="screen result-screen" hidden><p id="result-kind"></p><h1 id="result-title"></h1><p id="result-stats"></p><button data-action="result-continue">CONTINUE</button></section><section id="gameover-screen" class="screen gameover-screen" hidden><p>FAILED</p><h1>GAME OVER</h1><button data-action="gameover-title">PRESS ENTER</button></section><audio id="audio" preload="auto"></audio><audio id="preview" preload="none" loop></audio><script src="game.js"></script></body></html>
